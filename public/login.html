<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08111f">

  <title>Sign In | MONEVIA</title>

  <link rel="stylesheet" href="/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <header class="topbar">
    <a class="page-brand" href="/">
      <img src="/assets/logo.png" alt="MONEVIA logo">
      <span>MONEVIA</span>
    </a>

    <nav>
      <a href="/">Home</a>
      <a href="/marketplace.html">Marketplace</a>
      <a href="/tasks.html">Tasks</a>
      <a href="/register.html">Create account</a>
    </nav>
  </header>

  <main class="page-wrap">

    <section class="page-hero">
      <span class="eyebrow">WELCOME BACK</span>

      <h1>Sign in to MONEVIA.</h1>

      <p>
        Access your account and explore your marketplace activity.
      </p>
    </section>

    <section class="page-panel">

      <form class="page-form" id="loginForm">

        <label for="email">
          Email address

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            maxlength="254"
            required
          >
        </label>

        <label for="password">
          Password

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            maxlength="100"
            required
          >
        </label>

        <button
          class="btn btn-primary"
          id="loginButton"
          type="submit"
        >
          Sign in
        </button>

        <p
          class="page-error"
          id="message"
          role="status"
          aria-live="polite"
        ></p>

        <p class="page-muted">
          New to MONEVIA?
          <a href="/register.html">Create an account</a>.
        </p>

        <p class="page-muted">
          <a href="/" >Return to homepage</a>
        </p>

      </form>

    </section>

  </main>

  <footer class="page-footer">
    © <span id="year"></span> MONEVIA · Real value, transparent earnings.
  </footer>

  <script>
    "use strict";

    const SUPABASE_URL =
      "https://ndvxxjnqidxiecsfucxc.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_kVUK7nTwgIXQBlQ3rMuiuA_HM-_crjy";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    document.getElementById("year").textContent =
      new Date().getFullYear();

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      message.textContent = "";
      button.disabled = true;
      button.textContent = "Signing in…";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

        if (error) {
          throw error;
        }

        if (!data.session) {
          throw new Error(
            "No active session was created. Please try again."
          );
        }

        message.textContent =
          "Login successful. Opening your dashboard…";

        window.location.assign("/dashboard.html");

      } catch (error) {
        message.textContent =
          error.message || "Unable to sign in. Please try again.";

      } finally {
        button.disabled = false;
        button.textContent = "Sign in";
      }
    });
  </script>

</body>
</html>
