<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0f">
  <title>MONEVIA | Wallet</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .wallet-container {
      width: min(92%, 650px);
      margin: 40px auto;
    }.wallet-card {
  background: linear-gradient(135deg, #25253b, #101018);
  border: 1px solid #39394c;
  border-radius: 20px;
  padding: 28px;
  margin: 24px 0;
}

.wallet-label {
  color: #c3c3d1;
  font-size: 14px;
}

.wallet-balance {
  font-size: clamp(30px, 7vw, 42px);
  font-weight: 800;
  margin: 14px 0;
  overflow-wrap: anywhere;
}

.wallet-note {
  color: #b8b8c8;
  font-size: 13px;
  line-height: 1.6;
}

.wallet-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 24px;
}

.wallet-button {
  display: block;
  padding: 14px;
  text-align: center;
  border-radius: 10px;
  background: #ff7200;
  color: #fff;
  text-decoration: none;
  font-weight: 700;
}

.wallet-button.secondary {
  background: #292936;
  border: 1px solid #454554;
}

.wallet-section {
  background: #17171f;
  border: 1px solid #30303a;
  border-radius: 16px;
  padding: 22px;
  margin-top: 20px;
}

.wallet-section h2 {
  margin: 0 0 12px;
  font-size: 19px;
}

.wallet-section p {
  color: #c3c3d1;
  line-height: 1.7;
}

.back-link {
  display: inline-block;
  margin-bottom: 15px;
  color: #ff8b32;
  text-decoration: none;
}

  </style>
</head>
<body>
  <main class="wallet-container">
    <a class="back-link" href="dashboard.html">← Back to Dashboard</a><h1>My Wallet</h1>
<p>Manage your MONEVIA wallet.</p>

<section class="wallet-card">
  <p class="wallet-label">Available Balance</p>
  <div class="wallet-balance" id="walletBalance">₦0.00</div>
  <p class="wallet-note">
    This is a demonstration balance. No real money is stored or transferred.
  </p>

  <div class="wallet-actions">
    <a class="wallet-button" href="withdraw.html">Withdraw</a>
    <a class="wallet-button secondary" href="history.html">Transaction History</a>
  </div>
</section>

<section class="wallet-section">
  <h2>Wallet Information</h2>
  <p id="walletMessage">
    Your real wallet balance will appear here when a secure wallet backend
    is connected.
  </p>
</section>

  </main>  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const balanceElement = document.getElementById("walletBalance");

      if (balanceElement) {
        balanceElement.textContent = "₦0.00";
      }
    });
  </script></body>
</html>
